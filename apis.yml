aid: hypori
name: Hypori
description: >-
  Hypori, Inc. is a Reston, Virginia headquartered, service-disabled veteran-owned software
  company that builds Virtual Mobile Infrastructure (VMI) for zero-trust mobile access. Its
  products — Hypori Mobile, Hypori Lyte and Hypori Secure Messaging — run a fully isolated
  virtual Android workspace in Hypori's cloud and stream only encrypted pixels to the user's
  phone or tablet, so no organizational data is ever processed, transmitted or stored on the
  endpoint. That architecture keeps CUI, FCI, PII and PHI off personal devices and takes the
  mobile endpoint out of CMMC 2.0 Level 2 assessment scope. Hypori holds FedRAMP High
  authorization, a DoD/DoW Impact Level 5 provisional authorization, SOC 2 Type II, NIAP
  Common Criteria validation and NSA CSfC listing, and runs the U.S. Army BYOD and Department
  of the Air Force Workspace Anywhere programs. Hypori publishes a REST Management API for
  user, device-lifecycle and policy automation, documented in prose at docs.hypori.com; the
  API is authenticated with administrator client certificates plus an X-AUTH-TOKEN header and
  is served from each customer's own management cluster host.
