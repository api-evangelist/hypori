apis:
- name: Hypori Management API
  description: >-
    REST API for administering a Hypori deployment — managing user accounts, virtual device
    lifecycles, client and virtual-device policy assignments, and virtual-device template
    assignments. Requests are authenticated with an administrator .p12 client certificate,
    which is exchanged at POST /api/v2/authenticate/adminuilogin for a token supplied in the
    X-AUTH-TOKEN header on every subsequent call. The API is served from the management
    server of each customer's own cluster; Hypori publishes no OpenAPI definition and no
    public endpoint reference.
  humanURL: https://docs.hypori.com/Configure/managementAPI
  baseURL: https://{management-server-hostname}/api
  tags:
  - Management
  - Provisioning
  - Policy
  - Identity
  - Security
