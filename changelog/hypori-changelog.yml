- version: '2026.2.1'
  date: '2026-07-15'
  index_date_label: July 15th, 2026
  pdf_date_label: July 16th, 2026
  type: minor
  breaking: false
  url: https://docs.hypori.com/assets/files/hypori-release-notes-2026-2-1-d553820ae04d2a07d2516e6d96bf683c.pdf
  highlights:
  - Enrollment Portal — Purebred derived-credential users go straight to the OTP page; admins can disable self-service pages during scheduled maintenance.
  - Console 2.0 — Group Managers can see virtual-device transitional states; data-grid columns resize; full-row click selection.
  - App Gallery — fixed a self-update infinite loop; apps are streamed during install instead of staged on the virtual-device disk.
  - Hypori Assist — diagnostic files can be marked Done with a 7-day expiry and countdown column; PKI credential health status and credential diagnostic downloads for IL5 users.
  - Enhanced offline notifications can be overridden at the child-group level.
  note: >-
    The release-notes index dates this release July 15th, 2026; the PDF cover dates it
    July 16th, 2026. Both values are recorded verbatim rather than reconciled.
- version: '2026.2.0'
  date: '2026-06-18'
  type: major
  breaking: false
  url: https://docs.hypori.com/assets/files/hypori-release-notes-2026-2-537e8363e3a820eb7351fe6ca6753bee.pdf
  highlights:
  - Enhanced offline notifications — offline virtual devices surface sender, subject and message content (starting with Microsoft Outlook); optional, disabled by default, cluster or per-customer scoped, honoring existing content-sanitization policies.
  - Enrollment Portal — self-registration of a new CAC via guided Purebred steps; Okta Login and Okta Verify setup combined into one page; Personnel Type Code (PTC) allowlisting as an alternative to email allowlisting.
- version: '2026.1.1'
  date: '2026-04-27'
  type: minor
  breaking: false
  url: https://docs.hypori.com/assets/files/hypori-release-notes-2026-1-1-9ddb0a97e4bf8c2fe69d6b0fa6b87f75.pdf
  highlights:
  - Enrollment Portal now supports Hypori biometric authentication as an additional MFA option alongside Okta Verify and TOTP.
  - Enrollment activity tracked with event source, actor identity and role, for audit and compliance.
  - Console — reliable OTP email for external-LDAP-onboarded users; storage-volume extension for an existing virtual device; correct template sort by version; reliable JSON/XML editing in Console input fields.
