subject: Hypori Platform (Hypori Cloud on AWS, including customer-managed accounts)
note: >-
  Hypori maintains a public, dated release-notes index on its documentation host. Each entry
  links to a PDF; there is no HTML changelog, no RSS/Atom feed and no machine-readable release
  feed, so the entries below were read from the index page and, for the three most recent
  releases, from the PDFs themselves. The Management API has no separate changelog — API
  changes are not called out from platform releases, and no breaking-change notices are
  published.
format: pdf-per-release
feed: null
scheme:
  style: calendar-major-minor
  major: >-
    Major releases occur approximately quarterly and are numbered by year and sequence
    (e.g. 2024.3).
  minor: >-
    Minor releases carry the major release number plus an incremental series number
    (e.g. 2024.3.1) and are issued monthly between major releases for security updates and
    key product bug fixes.
  support_window: >-
    Minor releases are typically supported for the current and one previous major version
    (e.g. 2024.3 and 2024.2).
  feature_policy: >-
    New features are reserved for major releases, to reduce the risk of introducing changes
    during minor updates.
  client_apps: >-
    Hypori Client updates are published in the What's New sections of the Google Play Store
    and Apple App Store, not in the platform release notes.
