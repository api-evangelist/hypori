note: >-
  Hypori publishes no OpenAPI, so nothing here is derived from a contract. The API/technical
  conformance rows below are read from Hypori's own Management API documentation; the
  regulatory and certification rows are read from Hypori's own compliance statements and, where
  a third-party register carries the evidence, from that register's own document. Rows that
  Hypori claims but that could not be independently confirmed at a public register are marked
  conforms: true with evidence citing the provider claim, and self_attested: true.

api_conformance:
- id: rest
  conforms: true
  evidence: >-
    "The Hypori Management API is organized around REST ... has predictable resource-oriented
    URLs, accepts JSON-encoded request bodies, returns JSON-encoded responses, and uses
    standard HTTP response codes and verbs."
  source: https://docs.hypori.com/Configure/managementAPI
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document is served. /openapi.json, /openapi.yaml, /swagger.json and
    /api-docs all returned 404 on hypori.com, www.hypori.com and docs.hypori.com (2026-08-22).
- id: oauth2
  conforms: false
  evidence: Authentication is mTLS client certificate plus an X-AUTH-TOKEN header; no OAuth 2.0 flows are documented.
- id: oidc
  conforms: false
  evidence: >-
    No /.well-known/openid-configuration on any Hypori host (404). Okta is documented as an
    end-user identity option in the Enrollment Portal (2026.1.1 / 2026.2.0 release notes), but
    Hypori publishes no OIDC discovery document of its own.
- id: mutual-tls
  conforms: true
  evidence: >-
    Administrator API calls and Hypori client connections both use certificate-based (mTLS)
    authentication; the API example is "curl --cert mycert.p12:passphrase".
  source: https://docs.hypori.com/Configure/managementAPI
- id: rfc9457
  conforms: false
  evidence: No problem+json or error catalog is published; docs state only "standard HTTP response codes".
- id: pagination
  conforms: false
  evidence: No pagination convention is documented.
- id: idempotency
  conforms: false
  evidence: No idempotency key or retry semantics are documented.
- id: scim
  conforms: false
  evidence: >-
    User provisioning is documented against customer LDAP (external or Hypori-hosted internal),
    with APIs to automate provisioning — no SCIM schema URN, /scim/v2 surface or SCIM claim
    appears anywhere in the documentation.
  source: https://docs.hypori.com/Plan/integration
- id: ldap
  conforms: true
  evidence: >-
    "Hypori recommends integrating with an existing customer-managed LDAP server ... Hypori
    fetches the user's name, email address, and LDAP Distinguished Name (DN) from the LDAP
    server." Hypori also offers an internal LDAP server plus web-form and CSV bulk add.
  source: https://docs.hypori.com/Plan/integration

domain_standard:
  applicable: true
  market: US federal / defense mobility and regulated-industry BYOD
  declared_in_contract: false
  note: >-
    Hypori's market standards are authorization and assessment regimes (FedRAMP, DoD/DoW IL5,
    CMMC, NIAP Protection Profiles, NSA CSfC), not message or schema standards, and none of
    them is declared inside a machine-readable contract because Hypori publishes none. The
    regime conformance is real and third-party-validated; it simply is not expressed in the
    API surface. Recorded honestly as declared_in_contract: false rather than credited.

