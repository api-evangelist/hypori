reversibility:
  state: undocumented
  grade: none
  write_surface: true
  note: >-
    The Management API is explicitly a write surface — it manages user accounts, virtual device
    lifecycles, client and virtual-device policy assignments, and virtual-device template
    assignments. Hypori documents no reversal operation (no cancel/undo/restore/rollback) and
    no window for any of them. The Quick Start describes an Admin/User Administration portal
    whose actions include "Add/Delete individual users", "Add/Delete bulk groups of users" and
    "Re-issue a user QR code" — the QR code re-issue is the only recovery-shaped action named,
    and its only stated window is that an issued QR code is valid for 7 days. That is a
    credential-validity window, not a reversal window, so it is recorded here and NOT graded as
    reversibility.
  operations: []
  windows:
  - subject: user onboarding QR code
    window: valid for 7 days from issue
    source: https://docs.hypori.com/Configure/quickstart
    is_reversal_window: false
