note: >-
  Hypori publishes no priced plans. The pricing page is headed "Custom pricing that scales with
  you" and states that "every organization's security needs are unique, and our pricing reflects
  that". It names three organization sizes it serves — small teams, mid-sized enterprises and
  large organizations — but attaches no price, currency, billing period, seat minimum or
  included quota to any of them. The only calls to action are a request-a-quote form, contact
  sales, and request a demo. Public-sector buyers transact through resellers and marketplaces
  (Carahsoft, AWS Marketplace / AWS GovCloud) where pricing is likewise quote- or
  contract-based. Recorded as plan_count: 0 rather than omitted: this is a real, measured
  absence of published pricing, not a gap in the probe.
